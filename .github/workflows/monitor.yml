name: site-monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: site-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        id: mon
        env:
          MONITOR_STATE_DIR: ./monitor-state
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          set +e
          python3 site_monitor.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Persist evidence log
        if: always()
        run: |
          if [ -n "$(git status --porcelain monitor-state)" ]; then
            git config user.name  "site-monitor[bot]"
            git config user.email "site-monitor@users.noreply.github.com"
            git add monitor-state
            git commit -m "monitor run: $(date -u +%FT%TZ)"
            git push
          else
            echo "no changes to persist"
          fi

      - name: Attach evidence (serious change only)
        if: always() && steps.mon.outputs.code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: outside-pipeline-evidence-${{ github.run_id }}
          path: |
            monitor-state/**/evidence/**
            monitor-state/**/snapshots/**
          if-no-files-found: warn
          retention-days: 90

      - name: Post a plain-English alert (GitHub emails you the full text)
        if: always() && (steps.mon.outputs.code == '2' || steps.mon.outputs.code == '3')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATE="monitor-state/invisibleships.com"
          if [ ! -f "$STATE/latest_alert_title.txt" ]; then echo "no alert file; skipping"; exit 0; fi
          TITLE="$(cat "$STATE/latest_alert_title.txt")"
          KEY="$(cat "$STATE/latest_alert_key.txt")"
          { cat "$STATE/latest_alert.md"; printf '\n\nRun: %s\n' "$RUN_URL"; } > alert_body.md
          EXISTING="$(gh issue list --state open --search "$KEY in:title" --json number --jq '.[0].number' 2>/dev/null)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file alert_body.md || echo "comment failed (continuing)"
          else
            gh issue create --title "$TITLE" --body-file alert_body.md || echo "create failed (continuing)"
          fi

      - name: Fail the run on a SERIOUS change (so GitHub also emails you)
        if: steps.mon.outputs.code == '2' || steps.mon.outputs.code == '1'
        run: |
          if [ "${{ steps.mon.outputs.code }}" = "2" ]; then
            echo "::error::SERIOUS: a change to invisibleships.com with no publish, or the gate is down. See the new issue + evidence artifact."
          else
            echo "::error::Monitor errored (exit 1)."
          fi
          exit 1

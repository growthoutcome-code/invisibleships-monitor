name: site-monitor-digest
on:
  schedule:
    - cron: '0 13,19,1 * * *'
  workflow_dispatch: {}
concurrency:
  group: site-monitor-digest
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run digest
        id: dg
        env:
          MONITOR_STATE_DIR: ./monitor-state
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python3 digest.py
      - name: Deliver digest via commit (push email)
        if: always()
        run: |
          git config user.name  "site-monitor[bot]"
          git config user.email "site-monitor@users.noreply.github.com"
          git add monitor-state
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -F monitor-state/invisibleships.com/LATEST_DIGEST.md
            git push
          fi
